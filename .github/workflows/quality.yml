name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint Python
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.10"
          args: check --output-format=github
          src: "."
      - name: Enforce English canonical documentation
        run: python scripts/check_english_docs.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
